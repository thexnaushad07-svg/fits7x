<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ff70b5">
<title>Funny Kids Drawing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(145deg,#fff4a8,#ffd5ef,#c8f4ff);color:#30304b}
header{text-align:center;padding:16px 10px 8px}h1{margin:0;font-size:clamp(24px,6vw,38px);color:#ff4c96;text-shadow:1px 2px white}header p{margin:6px 0}
main{max-width:900px;margin:auto;padding:10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff9;border:2px solid white;border-radius:20px;padding:12px;margin-bottom:12px}
button,label.btn{border:0;border-radius:14px;padding:10px 13px;font-size:16px;font-weight:700;background:#fff;color:#333;box-shadow:0 3px 0 #0001;cursor:pointer}button:active{transform:translateY(2px);box-shadow:none}.color{width:38px;height:38px;padding:0;border:3px solid white!important;border-radius:50%;cursor:pointer}.colors{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
input[type=range]{width:100px}#wrap{background:white;border:6px solid white;border-radius:22px;box-shadow:0 6px 22px #6b477a22;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}#stickerbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px}.sticker{font-size:28px;cursor:pointer;background:#fff;border:2px solid #ffe2f1;border-radius:14px;padding:4px 10px}.bottom{text-align:center;padding:10px;font-size:14px}footer{text-align:center;padding:12px;color:#69556b}
</style>
</head>
<body>
<header><h1>🎨 Funny Kids Drawing 🐣</h1><p>Draw, रंग भरो और मज़े करो! 🌈</p></header>
<main>
<div class="toolbar">
<button onclick="setMode('draw')">✏️ Draw</button><button onclick="setMode('erase')">🧽 Eraser</button>
<button onclick="undo()">↩️ Undo</button><button onclick="clearBoard()">🗑️ Clear</button>
<label class="btn">🖼️ Coloring page <input id="pagepick" type="file" accept="image/*" hidden onchange="loadPage(event)"></label>
<button onclick="savePic()">💾 Save</button>
</div>
<div class="toolbar">
<div class="colors" id="colors"></div>
<label>Brush <input id="size" type="range" min="2" max="36" value="8"></label>
</div>
<div id="wrap"><canvas id="canvas" width="900" height="650"></canvas></div>
<div id="stickerbar"><span>Funny stickers (tap to add):</span></div>
<div class="bottom">✨ अपनी कल्पना से मज़ेदार चित्र बनाओ! ✨</div>
</main><footer>Made for little artists 💖</footer>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');let drawing=false,mode='draw',color='#ff3e8e',size=8,last=null,undoStack=[];
const colors=['#ff3e8e','#ff6b35','#ffd400','#55c95f','#00b8e6','#5377ff','#9b59b6','#222222','#ffffff','#ff9ecf','#7c4dff','#00c49a','#a65b2b','#ff5252','#b4e334'];
colors.forEach(x=>{let b=document.createElement('button');b.className='color';b.style.background=x;b.title=x;b.onclick=()=>{color=x;mode='draw'};document.getElementById('colors').appendChild(b)});
const stickers=['🐸','🐱','🐶','🦄','🐻','🐼','🐵','🦋','🌈','⭐','❤️','🍕','🍦','🎈','🌻','👑','👓','👀','👻','🚗'];
stickers.forEach(s=>{let b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>addSticker(s);document.getElementById('stickerbar').appendChild(b)});
ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);
function saveState(){undoStack.push(c.toDataURL());if(undoStack.length>20)undoStack.shift()}
function setMode(m){mode=m}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function start(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}saveState();drawing=true;last=pos(e);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=mode==='erase'?'white':color;ctx.lineWidth=mode==='erase'?+document.getElementById('size').value*3:+document.getElementById('size').value;ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill();ctx.beginPath();ctx.moveTo(last.x,last.y)}
function move(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.strokeStyle=mode==='erase'?'white':color;ctx.lineWidth=mode==='erase'?+document.getElementById('size').value*3:+document.getElementById('size').value;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}
function end(e){drawing=false;last=null;try{if(e&&c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}catch(_){}}
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('lostpointercapture',end);
function undo(){if(!undoStack.length)return;let im=new Image();im.src=undoStack.pop();im.onload=()=>ctx.drawImage(im,0,0)}
function clearBoard(){if(confirm('चित्र साफ़ करें?')){saveState();ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}}
function addSticker(s){saveState();ctx.font='72px serif';ctx.fillText(s,c.width/2-36,c.height/2);mode='draw'}
function savePic(){let a=document.createElement('a');a.download='my-funny-drawing.png';a.href=c.toDataURL('image/png');a.click()}
function loadPage(e){let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{saveState();ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);let scale=Math.min(c.width/im.width,c.height/im.height);let w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)};im.src=URL.createObjectURL(f)}
</script></body></html>
